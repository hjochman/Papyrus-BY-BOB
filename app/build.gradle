// Signing credentials are never stored in the repo: read them from the git-ignored
// keystore.properties (project root), Gradle properties (~/.gradle/gradle.properties)
// or environment variables (PAPYRUS_STORE_PASSWORD, PAPYRUS_KEY_ALIAS, PAPYRUS_KEY_PASSWORD).
def keystoreProps = new Properties()
def keystoreFile = rootProject.file("keystore.properties")
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String key ->
    keystoreProps.getProperty(key) ?: project.findProperty(key) ?: System.getenv(key)
}

